    <script src="script.js"></script>
    <script>
        const items = document.querySelectorAll('.portfolio-item');
        const sidebar = document.getElementById('portfolio-sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const closeBtn = document.getElementById('sidebar-close');
        const sidebarContent = document.getElementById('sidebar-content');

        function openSidebar(item) {
            const title = item.dataset.title;
            const desc = item.dataset.desc;
            const links = JSON.parse(item.dataset.links || '[]');
            const vimeo = item.dataset.vimeo || null;
            const thumb = item.dataset.thumb || null;

            let linksHTML = '';
            if (links.length) {
                linksHTML = '<div class="sidebar-links">' +
                    links.map(l => `<a href="${l.url}" class="btn btn-color-2" target="_blank">${l.label}</a>`).join('') +
                    '</div>';
            }

            let mediaHTML = '';
            if (vimeo) {
                mediaHTML = `<div class="sidebar-video">${vimeo}</div>`;
            } else if (thumb) {
                mediaHTML = `<img src="${thumb}" class="sidebar-img" alt="${title}">`;
            }

            sidebarContent.innerHTML = `
                <h2 class="sidebar-title">${title}</h2>
                ${mediaHTML}
                <p class="sidebar-desc">${desc}</p>
                ${linksHTML}
            `;

            // Inject Vimeo player script if not already present
            if (vimeo && !document.querySelector('script[src="https://player.vimeo.com/api/player.js"]')) {
                const s = document.createElement('script');
                s.src = 'https://player.vimeo.com/api/player.js';
                document.body.appendChild(s);
            }

            sidebar.classList.add('open');
            overlay.classList.add('open');
            document.body.classList.add('sidebar-active');
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
            document.body.classList.remove('sidebar-active');
            sidebarContent.innerHTML = '';
        }

        items.forEach(item => item.addEventListener('click', () => openSidebar(item)));
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeSidebar();
        });
    </script>
